name: Test & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long!!

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint (optional — runs only if ESLint is configured)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint (if configured)
        # Continues without error if eslint is not installed — avoids blocking teams that
        # haven't set up linting yet. Remove the `|| true` once ESLint is fully configured.
        run: npx eslint src/ tests/ --format=compact || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Tests — Node 18 × Node 20 matrix
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Run tests with coverage (Node 20 only)
        if: matrix.node-version == '20'
        run: npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Upload coverage artifact
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
