<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOZ - Enterprise Group</title>
    <link rel="icon" type="image/svg+xml" href="/logo.png">
    <meta name="description" content="DOZ Enterprise Group - Innovative digital solutions and 5-star projects">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(76, 175, 80, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(34, 197, 94, 0.05) 0%, transparent 40%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(76, 175, 80, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 40px 20px;
            max-width: 900px;
        }

        /* Logo */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(76, 175, 80, 0.2);
            animation: logoFloat 3s ease-in-out infinite;
            border: 2px solid rgba(76, 175, 80, 0.3);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo svg {
            width: 70px;
            height: 70px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #4CAF50 50%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            animation: fadeInUp 1s ease;
        }

        .tagline {
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease 0.2s both;
        }

        /* Projects showcase */
        .projects {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 50px;
            animation: fadeInUp 1s ease 0.4s both;
        }

        .project {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            width: 200px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .project:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(76, 175, 80, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .project-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #4CAF50 0%, #22c55e 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-icon svg {
            width: 30px;
            height: 30px;
            color: white;
        }

        .project h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .project .stars {
            color: #f59e0b;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .project p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
        }

        /* Redirect notice */
        .redirect-notice {
            animation: fadeInUp 1s ease 0.6s both;
        }

        .redirect-text {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #22c55e);
            border-radius: 2px;
            animation: progress 4s linear forwards;
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .countdown {
            font-size: 2rem;
            font-weight: 700;
            color: #4CAF50;
            margin-top: 20px;
        }

        .skip-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #4CAF50;
            color: #4CAF50;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            color: #475569;
            font-size: 0.85rem;
            z-index: 10;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .tagline { font-size: 1rem; letter-spacing: 2px; }
            .projects { gap: 15px; }
            .project { width: 150px; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <a href="/up" class="logo" style="text-decoration: none;">
            <svg viewBox="0 0 100 100" fill="none">
                <rect x="15" y="25" width="70" height="50" rx="8" fill="#4CAF50"/>
                <rect x="25" y="35" width="20" height="15" rx="3" fill="white"/>
                <rect x="55" y="35" width="20" height="15" rx="3" fill="white"/>
                <rect x="25" y="55" width="50" height="10" rx="3" fill="white" opacity="0.7"/>
                <circle cx="75" cy="30" r="12" fill="#22c55e"/>
                <path d="M70 30 L73 33 L80 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <h1>DOZ</h1>
        <p class="tagline">Enterprise Group</p>

        <div class="projects">
            <div class="project" onclick="window.location.href='https://up.doz.com'">
                <div class="project-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <h3>DOZ UP</h3>
                <div class="stars">★★★★★</div>
                <p>File Sharing Platform</p>
            </div>

            <div class="project" onclick="window.location.href='/hub.html'">
                <div class="project-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h3>DOZ Hub</h3>
                <div class="stars">★★★★★</div>
                <p>Dashboard & Gallery</p>
            </div>

            <div class="project" onclick="window.location.href='/studio.html'">
                <div class="project-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <h3>DOZ Studio</h3>
                <div class="stars">★★★★★</div>
                <p>Image Editor</p>
            </div>
        </div>

        <div class="redirect-notice">
            <p class="redirect-text">Redirecting to DOZ UP...</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="countdown" id="countdown">4</div>
            <button class="skip-btn" onclick="redirect()">Skip to DOZ UP →</button>
        </div>
    </div>

    <div class="footer">
        © 2026 DOZ Enterprise Group. All rights reserved.
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Countdown and redirect
        let count = 4;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            if (count <= 0) {
                clearInterval(timer);
                redirect();
            }
        }, 1000);

        function redirect() {
            window.location.href = 'https://up.doz.com';
        }
    </script>
</body>
</html>
