<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) - Google Ads -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-441083115"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'AW-441083115');
    </script>

    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password - DOZ UP</title>
    <meta name="description" content="Reset your DOZ UP account password.">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" type="image/svg+xml" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-decoration: none;
        }
        .logo-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 20px rgba(16, 185, 129, 0.5));
        }
        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .logo p {
            color: #64748b;
        }
        .box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 35px;
        }
        h2 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-top: 12px;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            display: block;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .step { display: none; }
        .step.active { display: block; }
        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }
        .password-requirements {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
        }
        .password-strength {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/up" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#10b981"/>
                        <stop offset="50%" style="stop-color:#34d399"/>
                        <stop offset="100%" style="stop-color:#059669"/>
                    </linearGradient>
                    <linearGradient id="arrowGradient" x1="50%" y1="100%" x2="50%" y2="0%">
                        <stop offset="0%" style="stop-color:#059669"/>
                        <stop offset="100%" style="stop-color:#34d399"/>
                    </linearGradient>
                </defs>
                <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#logoGradient)"/>
                <path d="M25 62 C25 62 22 62 22 58 C22 52 28 50 32 50 C32 42 40 36 50 36 C60 36 68 42 68 50 C72 50 78 52 78 58 C78 62 75 62 75 62" fill="white" opacity="0.95"/>
                <path d="M50 28 L62 44 L54 44 L54 68 L46 68 L46 44 L38 44 Z" fill="url(#arrowGradient)"/>
            </svg>
            <h1>DOZ UP</h1>
            <p>Reset Password</p>
        </a>

        <div class="box">
            <!-- Step 1: Loading/Verifying Token -->
            <div id="step1" class="step active">
                <div style="text-align: center; padding: 40px 0;">
                    <div class="spinner" style="margin: 0 auto 20px; width: 40px; height: 40px; border-width: 3px;"></div>
                    <p style="color: #94a3b8;">Verifying reset link...</p>
                </div>
            </div>

            <!-- Step 2: Invalid/Expired Token -->
            <div id="step2" class="step">
                <div style="text-align: center; padding: 20px 0;">
                    <div style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px;">
                        <svg width="40" height="40" fill="#ef4444" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    </div>
                    <h2 style="margin-bottom: 10px;">Link Expired</h2>
                    <p class="subtitle" id="errorMessage">This password reset link has expired or is invalid.</p>
                </div>
                <a href="/login.html" class="btn btn-primary" style="text-decoration: none; text-align: center;">
                    Back to Login
                </a>
            </div>

            <!-- Step 3: Enter New Password -->
            <div id="step3" class="step">
                <h2>Create New Password</h2>
                <p class="subtitle">Enter your new password below</p>

                <div id="message" class="message"></div>

                <form id="resetForm" onsubmit="handleReset(event)">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="password" placeholder="Enter new password" required minlength="8">
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                        <p class="password-requirements">At least 8 characters</p>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="resetBtn">
                        Reset Password
                    </button>
                </form>
            </div>

            <!-- Step 4: Success -->
            <div id="step4" class="step">
                <div style="text-align: center; padding: 20px 0;">
                    <div class="success-icon">
                        <svg width="40" height="40" fill="#10b981" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    </div>
                    <h2 style="margin-bottom: 10px;">Password Reset!</h2>
                    <p class="subtitle">Your password has been changed successfully.</p>
                </div>
                <a href="/login.html" class="btn btn-primary" style="text-decoration: none; text-align: center;">
                    Sign In
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        let resetToken = null;

        // Get token from URL
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            resetToken = urlParams.get('token');

            if (!resetToken) {
                showStep(2);
                document.getElementById('errorMessage').textContent = 'No reset token provided. Please request a new password reset link.';
                return;
            }

            // Verify token
            verifyToken();
        }

        // Verify the reset token
        async function verifyToken() {
            try {
                const res = await fetch(`${API_BASE}/verify-reset-token?token=${resetToken}`);
                const data = await res.json();

                if (data.valid) {
                    showStep(3);
                } else {
                    document.getElementById('errorMessage').textContent = data.error || 'This link has expired or is invalid.';
                    showStep(2);
                }
            } catch (err) {
                document.getElementById('errorMessage').textContent = 'Failed to verify reset link. Please try again.';
                showStep(2);
            }
        }

        // Handle password reset form
        async function handleReset(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            // Validate password length
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return;
            }

            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password })
                });

                const data = await res.json();

                if (data.success) {
                    showStep(4);
                } else {
                    showMessage(data.error || 'Failed to reset password', 'error');
                }
            } catch (err) {
                showMessage('Connection error. Please try again.', 'error');
            }

            btn.innerHTML = 'Reset Password';
            btn.disabled = false;
        }

        // Show step
        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
        }

        // Show message
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const bar = document.getElementById('strengthBar');
            let strength = 0;
            let color = '#ef4444';

            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password)) strength += 15;
            if (/[a-z]/.test(password)) strength += 10;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 10;

            if (strength >= 75) color = '#10b981';
            else if (strength >= 50) color = '#f59e0b';
            else if (strength >= 25) color = '#f97316';

            bar.style.width = strength + '%';
            bar.style.background = color;
        });

        // Initialize
        init();
    </script>
</body>
</html>
