<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DOZ UP - Facebook Cover Photo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #222; }
.cover {
    width: 820px;
    height: 312px;
    background: linear-gradient(135deg, #0a0a0f 0%, #0d1a12 30%, #0a0a0f 60%, #101025 100%);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Animated mesh gradient bg */
.cover::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
        radial-gradient(circle at 15% 50%, rgba(0, 210, 106, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(0, 122, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 60% 80%, rgba(88, 86, 214, 0.08) 0%, transparent 35%);
}

/* Grid pattern */
.grid-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
}

/* Glowing orbs */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    z-index: 0;
}
.orb-1 { width: 200px; height: 200px; background: rgba(0, 210, 106, 0.2); top: -60px; left: -40px; }
.orb-2 { width: 150px; height: 150px; background: rgba(0, 122, 255, 0.15); top: 100px; right: 50px; }
.orb-3 { width: 120px; height: 120px; background: rgba(0, 255, 136, 0.1); bottom: -30px; left: 300px; }

.content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 60px;
    gap: 40px;
}

/* Logo */
.logo-area {
    flex-shrink: 0;
}
.logo-box {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #00d26a 0%, #00ff88 50%, #06d6a0 100%);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(0, 210, 106, 0.3), 0 0 60px rgba(0, 255, 136, 0.1);
    position: relative;
}
.logo-box svg {
    width: 60px;
    height: 60px;
}

/* Text */
.text-area {
    color: #fff;
}
.brand-name {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}
.brand-name span {
    background: linear-gradient(135deg, #00ff88 0%, #00d26a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.tagline {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}
.features {
    display: flex;
    gap: 20px;
}
.feature-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
}
.feature-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0,255,136,0.5);
}

/* Right side floating elements */
.floating-elements {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
}
.float-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(10px);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 13px;
    width: 200px;
}
.float-card .icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.icon-upload { background: rgba(0, 210, 106, 0.2); }
.icon-share { background: rgba(0, 122, 255, 0.2); }
.icon-secure { background: rgba(88, 86, 214, 0.2); }
.float-card .label { font-weight: 600; font-size: 12px; }
.float-card .sublabel { font-size: 10px; color: rgba(255,255,255,0.5); }

/* URL at bottom */
.url-bar {
    position: absolute;
    bottom: 16px;
    right: 60px;
    z-index: 3;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
    letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="cover">
    <div class="grid-overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="content">
        <div class="logo-area">
            <div class="logo-box">
                <svg viewBox="0 0 100 100" fill="none">
                    <!-- Cloud -->
                    <ellipse cx="50" cy="62" rx="30" ry="10" fill="white" opacity="0.95"/>
                    <path d="M22 60 C22 60 14 60 14 52 C14 42 22 38 30 38 C30 26 38 16 50 16 C62 16 70 26 70 38 C78 38 86 42 86 52 C86 60 78 60 78 60" fill="white" opacity="0.95"/>
                    <!-- Arrow -->
                    <path d="M50 10 L64 28 L56 28 L56 55 L44 55 L44 28 L36 28 Z" fill="url(#arrowG)"/>
                    <defs>
                        <linearGradient id="arrowG" x1="50%" y1="100%" x2="50%" y2="0%">
                            <stop offset="0%" stop-color="#00a854"/>
                            <stop offset="100%" stop-color="#00ff88"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        <div class="text-area">
            <div class="brand-name">DOZ <span>UP</span></div>
            <div class="tagline">Fast & Secure File Sharing Platform</div>
            <div class="features">
                <div class="feature-badge"><span class="dot"></span> Instant Upload</div>
                <div class="feature-badge"><span class="dot"></span> Encrypted</div>
                <div class="feature-badge"><span class="dot"></span> Free Forever</div>
            </div>
        </div>
    </div>

    <div class="floating-elements">
        <div class="float-card">
            <div class="icon icon-upload">&#9650;</div>
            <div><div class="label">Lightning Upload</div><div class="sublabel">One click, instant link</div></div>
        </div>
        <div class="float-card">
            <div class="icon icon-share">&#9741;</div>
            <div><div class="label">Share Anywhere</div><div class="sublabel">All platforms supported</div></div>
        </div>
        <div class="float-card">
            <div class="icon icon-secure">&#9919;</div>
            <div><div class="label">End-to-End Secure</div><div class="sublabel">256-bit encryption</div></div>
        </div>
    </div>

    <div class="url-bar">up.doz.com</div>
</div>
</body>
</html>
