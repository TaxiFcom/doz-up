<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6366f1"/>
            <stop offset="50%" style="stop-color:#8b5cf6"/>
            <stop offset="100%" style="stop-color:#06b6d4"/>
        </linearGradient>
        <linearGradient id="arrowGradient" x1="50%" y1="100%" x2="50%" y2="0%">
            <stop offset="0%" style="stop-color:#4f46e5"/>
            <stop offset="100%" style="stop-color:#06b6d4"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Background rounded square -->
    <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#logoGradient)"/>
    <!-- Cloud base shape -->
    <path d="M25 62 C25 62 22 62 22 58 C22 52 28 50 32 50 C32 42 40 36 50 36 C60 36 68 42 68 50 C72 50 78 52 78 58 C78 62 75 62 75 62"
          fill="white" opacity="0.95"/>
    <!-- Upward arrow -->
    <path d="M50 28 L62 44 L54 44 L54 68 L46 68 L46 44 L38 44 Z"
          fill="url(#arrowGradient)" filter="url(#glow)"/>
</svg>
